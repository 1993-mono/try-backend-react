# ============================================================
# Todos API 명세 (Express 기준)
# ------------------------------------------------------------
# 이 파일은 "프론트와 백엔드의 계약서"다.
# - 서버 코드가 무엇을 받는지
# - 무엇을 돌려주는지
# - 어떤 status를 쓰는지
# 를 문서(OpenAPI YAML)로 고정한다.
#
# 위치: docs/backend/api-design.yaml  (§9)
# 비교용(옛 명세): docs/frontend/api-spec.yaml  (Supabase 기준)
# ============================================================

# OpenAPI 스펙 버전.
# 3.0.x 문법을 쓴다는 뜻. (키 이름·구조 규칙이 이 버전에 맞춰짐)
openapi: 3.0.3

# 문서 메타 정보.
# Swagger UI 상단 제목/버전으로 보인다.
info:
  title: Todos API (Express)
  version: 1.0.0

# 기본 서버 주소.
# path가 /todos 이면 실제 URL은 http://localhost:3000/todos
servers:
  - url: http://localhost:3000

# ------------------------------------------------------------
# components
# - 여러 endpoint에서 재사용하는 "부품 창고"
# - securitySchemes: 인증 방식
# - schemas: JSON 형태(타입) 정의
# ------------------------------------------------------------
components:
  # ==========================================================
  # securitySchemes  ← OpenAPI 고정 키 (이름 바꾸면 안 됨)
  # ----------------------------------------------------------
  # "인증을 어떤 방식으로 하냐"를 적어 두는 곳.
  # 실제 토큰 검증 코드가 아니라, 명세(문서)용 선언이다.
  #
  # 바꿀 수 있는 것 / 없는 것:
  #   ❌ securitySchemes  → 고정 (auth, security 등으로 바꾸면 안 됨)
  #   ✅ bearerAuth       → 내가 지은 이름 (jwtAuth 등으로 바꿔도 됨)
  #      ※ 바꿀 경우 paths의 security: - bearerAuth: [] 도 같이 바꿔야 함
  #   ❌ type / scheme    → OpenAPI가 정한 값 (http, bearer)
  #   ✅ bearerFormat     → 문서 힌트 (JWT, 비워도 동작에는 영향 거의 없음)
  # ==========================================================
  securitySchemes:
    # --------------------------------------------------------
    # bearerAuth (이름: 자유)
    # --------------------------------------------------------
    # Express의 requireAuth가 기대하는 헤더와 같다.
    #   Authorization: Bearer eyJhbGciOi...
    #
    # 연결 방법 (아래 paths에서):
    #   security:
    #     - bearerAuth: []    ← 여기 이름이 위 키와 같아야 함
    #       [] 는 OAuth scope 자리. JWT만 쓰면 보통 빈 배열.
    # --------------------------------------------------------
    bearerAuth:
      type: http          # HTTP Authorization 헤더 사용
      scheme: bearer      # "Bearer " 접두사 방식
      bearerFormat: JWT   # 사람이 읽는 힌트 (JWT라고 적어 둠)
  # ==========================================================
  # schemas  ← OpenAPI 고정 키 (이름 바꾸면 안 됨)
  # ----------------------------------------------------------
  # 요청/응답 JSON 형태 사전.
  # paths에서 $ref: "#/components/schemas/Todo" 처럼 참조한다.
  #
  #   ❌ schemas     → 고정 (models, types 로 바꾸면 안 됨)
  #   ✅ Error, Todo → 내가 지은 스키마 이름 (바꾸면 $ref도 같이)
  # ==========================================================
  schemas:
    # --------------------------------------------------------
    # Error
    # 실패 응답 공통 형식.
    # Express 코드: res.status(4xx|5xx).json({ error: '...' })
    # --------------------------------------------------------
    Error:
      type: object
      properties:
        error:
          type: string

    # --------------------------------------------------------
    # Todo
    # DB에서 조회한 todo 1건의 형태
    # --------------------------------------------------------
    Todo:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        completed:
          type: boolean
        user_id:
          type: integer

    # --------------------------------------------------------
    # LoginRequest
    # POST /login 요청 body
    # required: username, password 둘 다 필수
    # --------------------------------------------------------
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    # --------------------------------------------------------
    # LoginResponse
    # 로그인 성공 시 토큰을 돌려줌
    # 예: { "token": "eyJ..." }
    # --------------------------------------------------------
    LoginResponse:
      type: object
      properties:
        token:
          type: string

    # --------------------------------------------------------
    # CreateTodo
    # POST /todos 요청 body
    # - title 필수
    # - completed는 선택 (없으면 서버 기본값 사용 가능)
    # --------------------------------------------------------
    CreateTodo:
      type: object
      required: [title]
      properties:
        title:
          type: string
        completed:
          type: boolean

    # --------------------------------------------------------
    # UpdateTodo
    # PATCH /todos/{id} 요청 body
    # 부분 수정이므로 required 없음
    # (title만, completed만, 둘 다 가능)
    # --------------------------------------------------------
    UpdateTodo:
      type: object
      properties:
        title:
          type: string
        completed:
          type: boolean

# ------------------------------------------------------------
# paths
# - 실제 API endpoint 목록
# - 구조: /경로 → method(get/post/...) → request/response
# ------------------------------------------------------------
paths:
  # ==========================================================
  # GET /health
  # - 서버가 살아 있는지 확인
  # - 인증 불필요
  # - Express: app.get('/health', ...)
  # ==========================================================
  /health:
    get:
      summary: 헬스체크
      responses:
        "200":
          description: 서버 정상
          content:
            application/json:
              # 재사용 스키마가 아니라 여기서 직접 정의
              # 응답 예: { "ok": true }
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  # ==========================================================
  # POST /login
  # - 아이디/비밀번호 확인 후 JWT 발급
  # - 인증 불필요 (로그인 전이므로)
  # - Express: routes/auth.js 의 POST /login
  # ==========================================================
  /login:
    post:
      summary: 로그인 · JWT 발급
      requestBody:
        required: true
        content:
          application/json:
            # $ref = components에 정의해 둔 스키마를 참조
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 토큰 발급 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: body 형식 오류 (필드 누락·타입 오류)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 인증 실패 (아이디/비밀번호 불일치)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ==========================================================
  # /todos (컬렉션)
  # - GET  : 목록
  # - POST : 생성
  # - 둘 다 JWT 필요 (requireAuth)
  # ==========================================================
  /todos:
    get:
      summary: todo 목록
      # security에 bearerAuth를 걸면
      # "이 API는 Authorization: Bearer 토큰이 필요하다"
      # 라는 계약이 된다.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 목록 조회 성공
          content:
            application/json:
              schema:
                # Todo 배열
                type: array
                items:
                  $ref: "#/components/schemas/Todo"
        "401":
          description: 토큰 없음·무효
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 서버/DB 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: todo 생성
      security:
        - bearerAuth: []
      requestBody:
        # 요청 body는 필수
        # (todo 생성을 위해 title 등이 들어와야 함)
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTodo"
      responses:
        "201":
          description: 생성 성공 (Created)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          description: 검증 실패 (title 누락·타입 오류 등)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 토큰 없음·무효
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 서버/DB 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ==========================================================
  # /todos/{id} (단건)
  # - Supabase 때: /todos?id=eq.1  (쿼리 필터)
  # - Express 지금: /todos/1       (경로 파라미터)
  # - OpenAPI에서는 :id 대신 {id} 표기
  # ==========================================================
  /todos/{id}:
    # ==========================================================
    # path 파라미터 정의 (/todos/:id)
    # ----------------------------------------------------------
    # OpenAPI에서는 URL 경로에 있는 변수를 {id} 형태로 쓴다.
    #
    # - Express 라우트: router.get('/:id', ...)
    # - Express에서 읽는 값: req.params.id
    #
    # 이 블록은 "id가 URL에 반드시 포함되어야 함"과
    # "id의 타입은 정수(integer)"를 문서로 고정한다.
    # ==========================================================
    parameters:
      - name: id
        # in: path → 쿼리(?id=...)가 아니라 URL 경로(/todos/1)에서 가져온다는 뜻
        in: path
        # required: true → /todos/<값> 형태가 아니면 호출 계약을 만족하지 못함
        required: true
        schema:
          # id 값의 타입. 실제 Express 코드에서는 string으로 들어오지만,
          # 문서에서는 integer로 계약을 고정한다.
          type: integer

    get:
      summary: todo 단건 조회
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "401":
          description: 토큰 없음·무효
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 해당 id 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 서버/DB 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    patch:
      summary: todo 부분 수정
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTodo"
      responses:
        "200":
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          description: 검증 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 토큰 없음·무효
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 해당 id 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 서버/DB 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: todo 삭제
      security:
        - bearerAuth: []
      responses:
        # 204는 "성공했지만 본문 없음"
        # Express: res.status(204).send()
        "204":
          description: 삭제 성공 (body 없음)
        "401":
          description: 토큰 없음·무효
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 해당 id 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 서버/DB 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"